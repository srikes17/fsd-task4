        <div class="container pt-5 pb-5">
            <form class="row g-4">
                <div class="col-12">
                    <label for="fullname1" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="fullname1" required>
                </div>
                <div class="col-12">
                    <label for="exampleInputEmail1" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="name@example.com" required>

                </div>
                <div class="col-12">
                    <label for="subject" class="form-label">Subject</label>

                </div>
                <div class="col-12">
                    <label for="phnumber1" class="form-label">Mobile</label>
                    <input type="number" class="form-control" id="phnumber1" required>
                </div>
                <div class="col-12">
                    <label for="floatingTextarea2" class="form-label">Message</label>
                    <div class="form-floating">
                        <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea2" style="height: 100px"></textarea>
                        <label for="floatingTextarea2">Comments</label>
                    </div>
                </div>
                
                <div class="col-3">
                    <button type="submit" class="btn btn-primary">Submit</button>
                </div>
