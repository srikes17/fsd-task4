<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/6b58ab9298.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg">
        <nav class="navbar navbar-expand-lg bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <img src="download.jfif" class="logo"/>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item m-2">
                            <a class="nav-link active text-light" aria-current="page" href="index.html">Home</a>
                        </li>
                        <li class="nav-item m-2">
                            <a class="nav-link text-light" href="#">About</a>
                        </li>
                        <li class="nav-item m-2">
                            <a class="nav-link text-light" href="#">Courses</a>
                        </li>
                        <li class="nav-item m-2">
                            <a class="nav-link text-light" href="#">Contact</a>
                        </li>
                        <li class="nav-item m-2">
                            <button class="btn btn-warning">Login</button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container pt-5 pb-5">
            <form class="row g-3">
                <div class="col-12">
                    <label for="fullname1" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="fullname1" required>
                </div>
                <div class="col-12">
                    <label for="rollnumber1" class="form-label">Roll Number</label>
                    <input type="text" class="form-control" id="rollnumber1" required>
                </div>
                <div class="col-12">
                    <label for="exampleInputEmail1" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="name@example.com" required>
                    <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
                </div>
                <div class="col-12">
                    <label for="phnumber1" class="form-label">Mobile</label>
                    <input type="number" class="form-control" id="phnumber1" required>
                </div>
                <div class="col-12">
                    <label for="inlineRadio1" class="form-label">Gender</label><br/>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1" value="Male">
                        <label class="form-check-label" for="inlineRadio1">Male</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2" value="Female">
                        <label class="form-check-label" for="inlineRadio2">Female</label>
                    </div>
                </div>
                <div class="col-12">
                    <label for="branch1" class="form-label">Branch</label>
                    <select class="form-select" required>
                        <option selected>Open this select menu</option>
                        <option value="CSE">CSE</option>
                        <option value="CSD">CSD</option>
                        <option value="CSM">CSM</option>
                        <option value="AIML">AIML</option>
                        <option value="IT">IT</option>
                        <option value="ECE">ECE</option>
                        <option value="EEE">EEE</option>
                        <option value="EIE">EIE</option>
                        <option value="CIVIL">CIVIL</option>
                        <option value="MECH">MECH</option>
                    </select>
                </div>
                <div class="col-12">
                    <label for="dob" class="form-label">Date of Birth</label>
                    <input type="date" class="form-control" id="dob" required>
                </div>
                <div class="col-12">
                    <label for="inputAddress" class="form-label">Address</label>
                    <input type="text" class="form-control" id="inputAddress" placeholder="1234 Main St" required>
                </div>
                <div class="col-12">
                    <label for="inputAddress2" class="form-label">Address 2</label>
                    <input type="text" class="form-control" id="inputAddress2" placeholder="Apartment, studio, or floor">
                </div>
                <div class="col-md-6">
                    <label for="inputCity" class="form-label">City</label>
                    <input type="text" class="form-control" id="inputCity" required>
                </div>
                <div class="col-md-4">
                    <label for="inputState" class="form-label">State</label>
                    <select id="inputState" class="form-select" required>
                        <option selected>Choose...</option>
                        <option>...</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="inputZip" class="form-label">Zip</label>
                    <input type="text" class="form-control" id="inputZip" required>
                </div>
                <div class="col-12">
                    <label for="photo" class="form-label">Passport Size Photo</label>
                    <input type="file" accept="image/*" class="form-control" id="photo" required>
                </div>      
                <div class="col-12 form-check">
                    <input type="checkbox" class="form-check-input" id="exampleCheck1" required>
                    <label class="form-check-label" for="exampleCheck1">Apply Terms & Conditions</label>
                </div>
                <div class="col-3">
                    <button type="submit" class="btn btn-primary">Register</button>
                </div>
            </form>
        </div>

        <div class="footer bg-secondary text-center p-2">
            <div class="d-flex flex-row justify-content-center">
                <div class="web-link">
                    <a target="_blank" href="https://mail.google.com/mail/u/0/#inbox?compose=CllgCJlHmlZFHWWmzwMFVzMFhGdLhVlkvptdTtKmmTQXwMnHhdBmScsJQsJmbzMtTzcLrDlwHRg">
                        <i class="fa-logos fa-solid fa-envelope"></i>
                    </a>
                </div>
                <div class="web-link">
                    <a target="_blank" href="https://instagram.com">
                        <i class="fa-logos fa-brands fa-instagram"></i>
                    </a>
                </div>
                <div class="web-link">
                    <a target="_blank" href="https://facebook.com">
                        <i class="fa-logos fa-brands fa-facebook"></i>
                    </a>
                </div>
                <div class="web-link">
                    <a target="_blank" href="https://x.com">
                        <i class="fa-logos fa-brands fa-x-twitter"></i>    
                    </a>
                </div>
            </div>
            <p class="footer-para text-light">&copy;2026 All rights reserved</p>
        </div>
        
    </div>
</body>
</html>
